name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # The database tests run against a real PostgreSQL, the same major
    # version as production. Each test file works in a schema of its own.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: canvas
          POSTGRES_PASSWORD: canvas
          POSTGRES_DB: canvas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canvas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://canvas:canvas@localhost:5432/canvas

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
