name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # TODO: cuando exista package-lock.json, usar `npm ci` y activar `cache: npm`.
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
