# Local PostgreSQL for development: `docker compose up -d`.
# The server connects to it by default when DATABASE_URL is not set.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: canvas
      POSTGRES_DB: canvas
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U canvas']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
